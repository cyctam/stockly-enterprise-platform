on:
  push:
    branches: dev
    paths:
      - "infrastructure/**"
      - ".github/workflows/ecs-deploy.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Login to AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume:
          aws-region: us-east-1
      - name: Get task definition
        id: task-def
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition  --query 'taskDefinition' --output json)
          echo "::set-output name=task-definition::$TASK_DEF"
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service:
          cluster:
          wait-for-service-stability: true
